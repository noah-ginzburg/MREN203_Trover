ekf_filter_node:
  ros__parameters:
    frequency: 7.0
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Odometry from diff_drive plugin
    odom0: /odom
    odom0_config:
      [false, false, false,    # position (x, y, z) 
       false, false, false,    # orientation (roll, pitch, yaw) 
       true,  false,  false,    # linear velocity (vx, vy, vz) 
       false, false, true,     # angular velocity (vroll, vpitch, vyaw)
       false, false, false]    # linear acceleration (ax, ay, az) 

    imu0: /imu/data
    imu0_config:
      [false, false, false,   # position (x, y, z)
       false, false, false,   # orientation (roll, pitch, yaw)
       false, false, false,   # linear velocity (vx, vy, vz)
       false, false, true,    # angular velocity (only yaw rate)
       false, false, false]   # linear acceleration

    imu0_differential: false
    imu0_remove_gravitational_acceleration: false
